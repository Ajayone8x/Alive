
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Premium Live Stream Player">
    <meta name="theme-color" content="#ffffff">
    <title>Ajayxl!ve</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">
    
    <!-- Plyr Player -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" crossorigin="anonymous">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            /* Premium Light Theme Variables */
            --bg-deep: #f8fafc;
            /* Subtle top-down fade from pure white to very light gray */
            --bg-gradient: linear-gradient(to bottom, #ffffff 0%, #f1f5f9 100%);
            
            /* Glassmorphism Surface (White Frost) */
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(0, 0, 0, 0.08);
            --glass-blur: blur(20px);
            --glass-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.08);

            /* Accents */
            --accent-primary: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.25);
            --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            
            /* Text */
            --text-primary: #1e293b; /* Dark Slate */
            --text-secondary: #64748b; /* Medium Slate */
            
            /* Status */
            --danger: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.2);
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-deep);
            background-image: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem;
            overflow-x: hidden;
        }

        /* Ambient Glow (Subtle Blue in background) */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: 50%;
            transform: translateX(-50%);
            width: 120%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(59, 130, 246, 0.05) 0%, transparent 60%);
            z-index: -1;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            opacity: 0;
            transform: translateY(30px);
            animation: slideUpFade 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes slideUpFade { to { opacity: 1; transform: translateY(0); } }

        /* --- Header Styling --- */
        .stream-header {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            padding: 1rem 2rem;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            box-shadow: var(--glass-shadow);
        }

        .stream-header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            /* Dark Gradient Text */
            background: linear-gradient(to right, #0f172a, #475569);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        .live-badge {
            background: rgba(239, 68, 68, 0.1);
            color: #dc2626; /* Darker red for visibility on white */
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 0.4rem 1rem;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 4px 12px var(--danger-glow);
            letter-spacing: 1px;
        }

        .live-badge i { font-size: 0.6rem; animation: pulseRed 2s infinite; }
        
        @keyframes pulseRed {
            0% { transform: scale(0.95); opacity: 0.7; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.7; }
        }

        /* --- Player Styling --- */
        #player-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            position: relative;
            z-index: 10;
        }

        /* Hiding Shaka Spinner */
        .shaka-spinner-container, .shaka-spinner { display: none !important; }

        .shaka-video-container { font-family: 'Outfit', sans-serif; }
        
        /* Keep controls dark even on light theme for video contrast */
        .shaka-controls-button-panel {
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent) !important;
        }
        .shaka-overflow-menu, .shaka-settings-menu {
            background-color: rgba(15, 23, 42, 0.95) !important;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px !important;
            color: #fff !important;
        }

        /* --- Grid Panels --- */
        .grid-panels {
            display: grid;
            gap: 1.5rem;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            margin-top: 2rem;
        }

        .info-card {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
            box-shadow: var(--glass-shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .info-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.12);
        }

        .info-card h2 {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }

        /* --- Buttons --- */
        .action-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            background: var(--accent-gradient);
            color: white;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .action-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.4);
        }

        .action-button::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(255,255,255,0.2), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .action-button:hover::after { opacity: 1; }

        .action-button.copied { background: var(--success); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }

        /* --- Telegram Popup --- */
        .telegram-popup {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            /* White background for popup */
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0,0,0,0.1);
            padding: 2.5rem 2rem;
            border-radius: 20px;
            z-index: 10000;
            text-align: center;
            width: 90%; max-width: 400px;
            display: none;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.2);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        .telegram-popup h2 { 
            color: #1e293b; 
            font-size: 1.5rem; 
            margin-bottom: 0.5rem; 
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        
        .telegram-popup .fa-telegram { color: #2AABEE; }
        
        .telegram-popup p { 
            color: #64748b; 
            font-size: 0.95rem; 
            margin-bottom: 1.5rem; 
            line-height: 1.6;
        }

        .telegram-popup .popup-button {
            width: 100%;
            padding: 1rem;
            margin-top: 0.75rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.2s;
        }

        .telegram-popup .join-btn {
            background: #2AABEE;
            color: white;
            box-shadow: 0 4px 15px rgba(42, 171, 238, 0.3);
            border: none;
        }
        
        .telegram-popup .join-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(42, 171, 238, 0.4); }

        .telegram-popup .joined-btn {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid rgba(0,0,0,0.1);
        }
        
        .telegram-popup .joined-btn:hover { background: rgba(0,0,0,0.05); color: var(--text-primary); }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            body { padding: 1rem 0.5rem; }
            .stream-header { flex-direction: column; gap: 1rem; text-align: center; padding: 1rem; }
            .grid-panels { grid-template-columns: 1fr; gap: 1rem; }
            .telegram-popup { padding: 2rem 1.5rem; }
        }
        
        /* Error Message Style */
        .error-message {
            background: #fff;
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 16px;
            padding: 3rem;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        .error-message h2 { color: #dc2626; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <main class="container">
        <div id="stream-content">
            <div style="height: 400px; display: flex; align-items: center; justify-content: center; color: var(--text-secondary);">
                <i class="fa-solid fa-circle-notch fa-spin fa-2x"></i>
            </div>
        </div>
    </main>

    <div class="telegram-popup" id="telegramPopup">
        <h2 id="popup-title"><i class="fa-brands fa-telegram"></i> Join The Action</h2>
        <p>Get instant <strong>Ajayxl!ve</strong>, match highlights, and exclusive cricket updates on our official channel.</p>
        <a href="https://t.me/+6H0lhRBbr702OTY1" target="_blank" rel="noopener noreferrer" class="popup-button join-btn">Join Channel Now</a>
        <button class="popup-button joined-btn" onclick="document.getElementById('telegramPopup').style.display='none';">I've Already Joined</button>
    </div>

    <script>
        // --- SCRIPT MODIFIED WITH NEW SHAKA PLAYER (v4.7.11) ---

        document.addEventListener("shaka-ui-loaded", initializeApp);
        document.addEventListener("shaka-ui-load-failed", (error) => console.error("Shaka UI failed to load.", error));

        async function initializeApp() {
            shaka.polyfill.installAll();
            if (!shaka.Player.isBrowserSupported()) {
                console.error('Browser not supported');
                renderErrorUI("Browser Not Supported", "Your browser does not support the required features for this video player.");
                return;
            }

            try {
                // Fetch streams.json
                const response = await fetch('https://raw.githubusercontent.com/Ajayone8x/Alive/refs/heads/main/streams.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const streams = await response.json();

                const urlParams = new URLSearchParams(window.location.search);
                const streamId = urlParams.get('id');
                const streamData = streams[streamId];

                if (streamData) {
                    streamData.id = streamId;
                    document.title = `${streamData.name} // Live Stream`;

                    if (streamData.type === 'iframe') {
                        renderIframeUI(streamData);
                    } else {
                        renderPlayerUI(streamData);
                        
                        // Initialize player based on playerType in JSON
                        const playerType = streamData.playerType || 'shaka';
                        
                        if (playerType === 'plyr') {
                            initPlyrPlayer(streamData);
                        } else if (playerType === 'jwplayer') {
                            initJWPlayer(streamData);
                        } else {
                            initShakaPlayer(streamData);
                        }
                    }

                    setTimeout(() => { document.getElementById('telegramPopup').style.display = 'block'; }, 2500); 
                } else {
                    renderErrorUI("Stream Not Found", "The requested stream ID is invalid, or the stream is currently offline.");
                }

            } catch (error) {
                console.error("Failed to fetch streams:", error);
                renderErrorUI("Connection Failed", "Could not load stream configuration. Please check your internet connection.");
            }
        }

        function renderIframeUI(data) {
            const contentDiv = document.getElementById('stream-content');
            contentDiv.innerHTML = `
                <div class="stream-header">
                    <h1>${data.name}</h1>
                    <span class="live-badge"><i class="fa-solid fa-circle"></i> LIVE NOW</span>
                </div>
                <div id="player-container">
                    <iframe 
                        src="${data.iframeSrc}" 
                        style="width:100%; height:100%; border:0;" 
                        allow="encrypted-media; autoplay" 
                        allowfullscreen>
                    </iframe>
                </div>
                <div class="grid-panels">
                    <div class="info-card">
                        <h2>📣 Follow us for more Updates!</h2>
                        <a href="https://t.me/+6H0lhRBbr702OTY1" target="_blank" rel="noopener noreferrer" class="action-button">
                            <i class="fa-brands fa-telegram"></i> Join Telegram
                        </a>
                    </div>
                    <div class="info-card">
                        <h2><i class="fa-solid fa-share-nodes"></i> Share Stream</h2>
                        <button class="action-button" id="shareButton">
                             Click Here To Share This Page Link ❤️
                        </button>
                    </div>
                </div>
            `;
            document.getElementById('shareButton').addEventListener('click', copyAndShare);
        }

        function renderPlayerUI(data) {
            const contentDiv = document.getElementById('stream-content');
            contentDiv.innerHTML = `
                <div class="stream-header">
                    <h1>${data.name}</h1>
                    <span class="live-badge"><i class="fa-solid fa-circle"></i> LIVE NOW</span>
                </div>
                
                <div id="player-container">
                    <video id="video-player" style="width:100%;height:100%;" autoplay playsinline preload="auto" controls></video>
                </div>

                <div class="grid-panels">
                    <div class="info-card">
                        <h2> 📣 Follow us for more Updates!</h2>
                        <a href="https://t.me/+6H0lhRBbr702OTY1" target="_blank" rel="noopener noreferrer" class="action-button">
                            <i class="fa-brands fa-telegram"></i> Join Telegram
                        </a>
                    </div>
                    <div class="info-card">
                        <h2><i class="fa-solid fa-share-nodes"></i>Share our page</h2>
                        <button class="action-button" id="shareButton">
                             Click Here To Share This Page Link ❤️
                        </button>
                    </div>
                </div>
            `;
            document.getElementById('shareButton').addEventListener('click', copyAndShare);
        }

        function renderErrorUI(title, message) {
            const contentDiv = document.getElementById('stream-content');
            document.title = `Error - ${title}`;
            contentDiv.innerHTML = `
                <div class="error-message">
                    <h2><i class="fa-solid fa-triangle-exclamation"></i> ${title}</h2>
                    <p>${message}</p>
                </div>
            `;
        }

        async function initShakaPlayer(data) {
            const video = document.getElementById('video-player');
            const container = document.getElementById('player-container');
            if (!video || !container) return;

            const player = new shaka.Player();
            await player.attach(video);

            const ui = new shaka.ui.Overlay(player, container, video);

            ui.configure({
                controlPanelElements: [
                    'play_pause', 'time_and_duration', 'mute', 'volume',
                    'spacer', 'language', 'captions', 'picture_in_picture',
                    'quality', 'fullscreen'
                ],
                // Volume bar color updated to match blue accent
                volumeBarColors: { base: 'rgba(255, 255, 255, 0.4)', level: '#3b82f6' },
                seekBarColors:   { base: 'rgba(255, 255, 255, 0.4)', buffered: 'rgba(255, 255, 255, 0.6)', played: '#3b82f6' }
            });

            let drmConfig = data.keyId ? { clearKeys: { [data.keyId]: data.key } } : {};
            let license = data.license;
            let streamUrl = data.mpd;

            player.configure({
                drm: drmConfig,
                streaming: {
                    lowLatencyMode: true,
                    bufferingGoal: 5,           // Reduced from 15 to 5 seconds
                    rebufferingGoal: 1,         // Reduced from 2 to 1 second
                    bufferBehind: 10,           // Reduced from 15 to 10 seconds
                    retryParameters: { timeout: 5000, maxAttempts: 4, baseDelay: 200, backoffFactor: 1.5 },
                    segmentRequestTimeout: 5000, // Reduced from 8000 to 5000
                    segmentPrefetchLimit: 3,     // Increased from 2 to 3 for faster loading
                    useNativeHlsOnSafari: true,
                    stallEnabled: true,
                    stallThreshold: 1,           // Detect stalls quickly
                    stallSkip: 0.1,
                    jumpLargeGaps: true,         // Skip large buffering gaps
                    smallGapLimit: 0.5,
                    ignoreTextStreamFailures: true,
                    alwaysStreamText: false,
                    startAtSegmentBoundary: false,
                    infiniteRetriesForLiveStreams: true
                },
                manifest: { 
                    retryParameters: { timeout: 5000, maxAttempts: 4 },
                    defaultPresentationDelay: 3,  // Lower delay for faster start
                    availabilityWindowOverride: 60
                },
                abr: {
                    enabled: true,
                    switchInterval: 4,            // Faster quality adaptation
                    bandwidthUpgradeTarget: 0.85,
                    bandwidthDowngradeTarget: 0.90,
                    defaultBandwidthEstimate: 5000000 // Start with higher quality assumption
                }
            });

            if (license) {
                player.getNetworkingEngine().registerRequestFilter((type, request) => {
                    if (license.referer) request.headers['Referer'] = license.referer;
                    if (license.userAgent) request.headers['User-Agent'] = license.userAgent;

                    if (license.cookie) {
                        request.headers['Cookie'] = license.cookie;
                        if (
                            (type === shaka.net.NetworkingEngine.RequestType.MANIFEST ||
                            type === shaka.net.NetworkingEngine.RequestType.SEGMENT) &&
                            request.uris[0] && !request.uris[0].includes('__hdnea=')
                        ) {
                            const separator = request.uris[0].includes('?') ? '&' : '?';
                            request.uris[0] += separator + license.cookie;
                        }
                    }
                });
            }

            const enableAutoplay = () => {
                video.setAttribute('autoplay', '');
                video.setAttribute('playsinline', '');
                video.setAttribute('muted', '');
                video.autoplay = true;
                video.muted = true; // Start muted for better autoplay compatibility
            };

            const attemptAutoplay = async () => {
                try {
                    // First attempt with muted for better browser compatibility
                    video.muted = true;
                    await video.play();
                    // Unmute after successful autoplay
                    setTimeout(() => {
                        video.muted = false;
                        video.volume = 0.8;
                    }, 500);
                    return true;
                } catch (error) {
                    console.warn('Autoplay failed:', error);
                    try {
                        // Retry after small delay
                        await new Promise(resolve => setTimeout(resolve, 300));
                        await video.play();
                        return true;
                    } catch {
                        return false;
                    }
                }
            };

            player.addEventListener('error', (event) => console.error('Shaka Player Error:', event.detail));

            video.addEventListener('loadedmetadata', () => { video.volume = 0.8; });

            let hasUserInteracted = false;
            const enableSoundOnInteraction = () => {
                if (!hasUserInteracted && video.muted) {
                    video.muted = false;
                    hasUserInteracted = true;
                }
            };
            ['click', 'touchstart', 'keydown'].forEach(event => {
                document.addEventListener(event, enableSoundOnInteraction, { once: true });
            });

            try {
                enableAutoplay();
                await player.load(streamUrl);
                
                // Multiple autoplay attempts for better reliability
                if (video.readyState >= 3) {
                    await attemptAutoplay();
                } else {
                    video.addEventListener('canplay', async () => {
                        await attemptAutoplay();
                    }, { once: true });
                    
                    // Additional fallback attempts
                    setTimeout(async () => { 
                        if (video.paused) await attemptAutoplay(); 
                    }, 1000);
                    setTimeout(async () => { 
                        if (video.paused) await attemptAutoplay(); 
                    }, 2500);
                }
            } catch (error) {
                console.error('Load error:', error);
            }
            
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden && video.paused) attemptAutoplay();
            });
        }

        async function initPlyrPlayer(data) {
            const video = document.getElementById('video-player');
            if (!video) return;

            // Initialize Plyr
            const player = new Plyr(video, {
                controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'captions', 'settings', 'pip', 'airplay', 'fullscreen'],
                autoplay: true,
                muted: true,
                storage: { enabled: true, key: 'plyr' },
                quality: { default: 720, options: [1080, 720, 480, 360] },
                speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 2] }
            });

            // Set source
            player.source = {
                type: 'video',
                sources: [{
                    src: data.mpd || data.m3u8,
                    type: data.mpd ? 'video/mp4' : 'application/x-mpegURL'
                }]
            };

            // Enable autoplay
            player.on('ready', () => {
                player.play().then(() => {
                    setTimeout(() => {
                        player.muted = false;
                        player.volume = 0.8;
                    }, 500);
                }).catch(err => console.warn('Plyr autoplay failed:', err));
            });

            // Unmute on user interaction
            let hasInteracted = false;
            const unmute = () => {
                if (!hasInteracted) {
                    player.muted = false;
                    hasInteracted = true;
                }
            };
            ['click', 'touchstart'].forEach(event => {
                document.addEventListener(event, unmute, { once: true });
            });
        }

        async function initJWPlayer(data) {
            const container = document.getElementById('player-container');
            if (!container) return;

            // Clear container and set id for JWPlayer
            container.innerHTML = '<div id="jwplayer-container"></div>';

            // Initialize JWPlayer
            const player = jwplayer('jwplayer-container');
            
            player.setup({
                file: data.mpd || data.m3u8,
                type: data.mpd ? 'dash' : 'hls',
                width: '100%',
                height: '100%',
                autostart: true,
                mute: true,
                controls: true,
                primary: 'html5',
                hlshtml: true,
                stretching: 'uniform',
                preload: 'auto',
                liveSyncDuration: 5,
                aspectratio: '16:9',
                playbackRateControls: true,
                cast: {},
                sharing: {
                    sites: ['facebook', 'twitter', 'email']
                }
            });

            // Enable autoplay and unmute
            player.on('ready', () => {
                player.play();
                setTimeout(() => {
                    player.setMute(false);
                    player.setVolume(80);
                }, 500);
            });

            // Unmute on user interaction
            let hasInteracted = false;
            const unmute = () => {
                if (!hasInteracted && player.getMute()) {
                    player.setMute(false);
                    hasInteracted = true;
                }
            };
            ['click', 'touchstart'].forEach(event => {
                document.addEventListener(event, unmute, { once: true });
            });

            player.on('error', (error) => {
                console.error('JWPlayer Error:', error);
            });
        }

        async function copyAndShare() {
            const shareButton = document.getElementById('shareButton');
            const originalHTML = shareButton.innerHTML;
            try {
                await navigator.clipboard.writeText(window.location.href);
                shareButton.innerHTML = `<i class="fa-solid fa-check"></i> Link Copied!`;
                shareButton.classList.add('copied');
                setTimeout(() => { shareButton.innerHTML = originalHTML; shareButton.classList.remove('copied'); }, 2000);
            } catch (err) { console.error('Failed to copy link:', err); }
        }
    </script>
    <script disable-devtool-auto src='https://cdn.jsdelivr.net/npm/disable-devtool'></script>
</body>
</html>
